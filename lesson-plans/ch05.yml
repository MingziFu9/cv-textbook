# 第 5 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 5
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出检测结果的三要素（边界框、类别、置信度），以及检测和分类的区别
  skill:
  - 计算两个框的交并比，解释非极大值抑制为什么能去掉重复框
  - 运行并修改给定代码，用 YOLO 找出行车画面里的车辆和行人、按类别计数
  - 读懂精确率、召回率、mAP50 和 mAP50-95，判断辅助驾驶中置信度门槛应该偏高还是偏低
  - 按步骤准备 YOLO 格式的数据集，训练并评估一个道路目标检测器
  quality:
  - 理解“多报还是少报”的取舍关系到行人安全，培养负责任的工程判断
  - 训练耗时较长，培养耐心和合理安排时间的习惯
key_points:
- 检测三要素：边界框、类别、置信度
- 交并比与非极大值抑制
- 精确率、召回率与 mAP
- YOLO 标注格式与训练自己的检测器
difficulties:
- point: 交并比的计算和“框得对不对”的判断
  solution: 用“IoU 计算器”拖动两个框，全班口算 10×10 框重叠一半的交并比 0.33
- point: 精确率和召回率此消彼长，门槛该高该低
  solution: 用“置信度门槛”动画和四个门槛的对比表口算精确率召回率；讨论行人提醒和紧急刹车分别更看重哪个
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 5 章 目标检测：找出图中的物体，操作交互动画“IoU 计算器”、“置信度门槛”；完成本章 ★ 实验 5-1～5-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：上一章，小林做了一个“认车型”的分类器，但它有个前提：得有人先把每辆车从画面里裁出来。


      “能不能让模型自己在画面里找？……'
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 15
    content: 检测的输出、交并比与非极大值抑制
    teacher: 演示 IoU 计算器，用“选班长”比喻讲 NMS
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 15
    content: 置信度门槛、精确率、召回率与 mAP
    teacher: 用置信度门槛动画和实验 5-2 的表格让学生口算；分组讨论不同场景的门槛
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，联系行车安全
  - name: 重点讲授
    minutes: 15
    content: YOLO 格式与训练结果分析
    teacher: 讲解训练曲线和各类 AP（car 0.879、cyclist 0.340），分析原因
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 把第 4 章“分析错例”的方法用到检测
  - name: 实验答疑
    minutes: 25
    content: 答疑实验 5-1～5-3，重点讲 r[0]、标注比例坐标、No labels found；实验 5-3 建议课前已启动训练
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明精确率和召回率的区别，并分别举一个“更看重精确率”和“更看重召回率”的视觉应用。
- 简答题：简述非极大值抑制的步骤，并说明 YOLO26 为什么不需要它。
- 简答题：小林训练的检测器 mAP50 为 0.6，其中 pedestrian 类只有 0.3。请分析可能的原因，并提出改进办法。
- 实操题：修改实验 5-1 的代码：检测 `street_crossing.jpg`，只保留置信度 ≥ 0.4 的 person，打印人数，并把每个人的框中心点坐标打印出来。
- 实验报告：实验 5-1、实验 5-2、实验 5-3、实验 5-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
