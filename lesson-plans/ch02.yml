# 第 2 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 2
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 HSV 三个分量的含义，以及均值、高斯、中值三种滤波各自的做法
  - 解释直方图怎样反映一张图偏亮还是偏暗，直方图均衡化为什么能让夜间画面看得清
  skill:
  - 运行并修改给定代码，用 OpenCV 完成裁剪、缩放、调亮、去噪、按颜色选像素和二值化
  - 比较同一张噪声图在不同滤波方法和窗口大小下的效果，说出“去噪”和“保细节”怎样取舍
  - 判断用颜色找车道线这种方法在什么情况下会失效
  quality:
  - 处理行车照片时注意保护画面中的个人信息
  - 养成对比实验、用数据（平均亮度、像素占比）说话的习惯
key_points:
- 读、显示、保存与 BGR↔RGB 转换；resize 先宽后高
- HSV 颜色空间与 inRange 掩膜
- 直方图与直方图均衡化
- 三种滤波去噪与阈值二值化
difficulties:
- point: HSV 三个分量的含义，H 的范围是 0～180
  solution: 用动画“HSV 调色板”拖动范围，只选出黄色车道线；对照色环记住各颜色的 H 范围
- point: 直方图均衡化为什么能把暗图调亮
  solution: 用“全班成绩按名次重新给分”的比喻，对比均衡化前后的直方图（平均亮度 24.0 → 93.3）
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 158
    content: 阅读网页教材第 2 章 图像处理基础：用 OpenCV 修图，操作交互动画“HSV 调色板”、“滤波器对比”；完成本章 ★ 实验 2-1～2-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林报名了这门课，第一件事是交一张白底一寸证件照。翻遍手机，只有一张去年办社保卡时拍的蓝底照片。照相馆说换底色要 20 ……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 颜色空间与掩膜：证件照换底色
    teacher: 演示实验 2-1 的 inRange 和 img[mask == 255] 换底色，用 HSV 调色板动画讲范围
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一，引出贯穿全书的掩膜
  - name: 重点讲授
    minutes: 10
    content: 直方图、均衡化与滤波：让夜间画面看得清
    teacher: 对比直接调亮和均衡化；用“滤波器对比”动画比较三种滤波和窗口大小
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 2-1～2-3，重点讲 resize 宽高写反、滤波窗口必须是奇数；讨论颜色法找车道线为何夜间失效
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 157
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明：为什么找黄色车道线时用 HSV 比用 RGB 方便？
- 简答题：下面是一块 3×3 的灰度值，分别计算均值滤波和中值滤波后中间像素的新值，并说明哪种方法更适合去掉这个噪点。
- 简答题：小林想让辅助驾驶助手在夜间也能看清路面。请为一帧夜间画面设计一个预处理流程（至少三步），并说明每一步的作用和可能的副作用。
- 实操题：修改实验 2-1 的代码：读入 `pills.jpg`，转成灰度图，用大津法自动二值化，打印算出的门槛和白色像素所占的比例，并保存二值图。
- 实验报告：实验 2-1、实验 2-2、实验 2-3、实验 2-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
