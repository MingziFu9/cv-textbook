# 第 3 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 3
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出常见的图像特征（颜色、边缘、角点、纹理、形状），以及 Canny 两个门槛各自的作用
  - 解释卷积核在图上滑动“乘一乘、加一加”的过程，并手算一格
  skill:
  - 运行并修改给定代码，用轮廓数药片，用“边缘 + 霍夫直线”在照片和视频里找车道线
  - 比较按颜色和按边缘找车道线的优缺点，分析手工规则为什么容易误判
  - 判断行车画面中哪些内容属于个人信息，需要打码后才能分享
  quality:
  - 理解人脸、车牌属于个人信息，分享行车画面前主动打码
  - 体会从手工规则到机器学习的演进，形成实事求是看待技术局限的科学态度
key_points:
- Canny 边缘检测与双门槛
- 霍夫直线与传统车道线检测流程
- 轮廓查找与外接矩形
- 卷积“乘一乘、加一加”
difficulties:
- point: 卷积的计算过程和卷积核决定找什么
  solution: 用动画“卷积核滑动”逐格演示；全班手算一格（实验 3-2 结果 −309），再用 filter2D 验证
- point: Canny 两个门槛的作用
  solution: 用动画“Canny 双门槛”拖动门槛，对照 (10,30)、(50,150)、(150,300) 三组边缘像素数
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 158
    content: 阅读网页教材第 3 章 图像特征：从边缘到卷积，操作交互动画“Canny 双门槛”、“卷积核滑动”；完成本章 ★ 实验 3-1～3-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：上一章，小林按颜色找车道线，白天效果不错，一到夜里就一根也找不到了。


      老王看了说：“你想想，人开夜车的时候，看到的车道……'
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 边缘、霍夫直线与车道线流程
    teacher: 用 Canny 动画讲双门槛，展示车道线四个中间结果（8044 → 1408 → 15 条线段）
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，理解流程化处理
  - name: 重点讲授
    minutes: 10
    content: 卷积与从手工特征到 CNN
    teacher: 用卷积核动画手算一格，讨论手工特征的天花板，引出第 4 章
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一，为 CNN 打基础
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 3-1～3-3，重点讲 HoughLinesP 返回 None、findContours 需要单通道图；讨论实验 3-4 打码的必要性
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 157
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“评优秀学生”的比喻，说明 Canny 双门槛中高门槛和低门槛各起什么作用。
- 简答题：比较第 2 章“按颜色找车道线”和本章“按边缘 + 直线找车道线”两种方法，各说出一个优点和一个缺点。
- 简答题：为什么说“卷积神经网络让机器自己学卷积核”是视觉技术的一次转折？结合手工特征的局限说明。
- 实操题：修改实验 3-1 的代码：只统计面积小于 2000 像素的“小药片”有几颗，并把它们的外接矩形画成红色、其余画成绿色。
- 实验报告：实验 3-1、实验 3-2、实验 3-3、实验 3-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
