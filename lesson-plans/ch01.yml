# 第 1 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 1
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出计算机视觉的五类常见任务，并各举一个生活中的例子
  - 解释一张彩色图片怎样变成一张“数字表”，读懂形状 `(高, 宽, 通道)`
  - 区分“辅助驾驶”和“自动驾驶”，说出驾驶自动化分为几级
  skill:
  - 运行给定代码，读入并显示一张图片，取出一个像素的值
  - 比较同一张照片交给分类、检测、分割、姿态估计四种模型后输出的不同
  quality:
  - 认识“辅助驾驶”不是“自动驾驶”，树立技术为人服务、驾驶员始终负责的安全意识
  - 养成遇到报错先读最后一行、对照报错表自己排查的习惯
key_points:
- 五类常见的视觉任务：分类、检测、分割、姿态估计、生成
- 图片是数字表：形状 (高, 宽, 通道)、像素取值、BGR 顺序
- 辅助驾驶分级与贯穿项目“智能辅助驾驶助手”
difficulties:
- point: 图片在计算机里是一张三维的数字表，形状先高后宽、颜色是 BGR
  solution: 用动画“像素放大镜”放大到单个像素读数；现场手算 1920×1080×3 有多少个数
- point: 分清分类、检测、分割、姿态四种任务输出的差别
  solution: 同一张照片交给四个模型，并排比较输出：一个词、一组框、一张掩膜、一组点
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 158
    content: 阅读网页教材第 1 章 走进计算机视觉，操作交互动画“像素放大镜”；完成本章 ★ 实验 1-1～1-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林在一家物流公司做调度，最近公司给货车装了一套“主动安全系统”：车道偏了，仪表盘会“嘀嘀”响；离前车太近，会闪红灯提醒……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 五类视觉任务；同一张照片四种答案
    teacher: 展示实验 1-3 四个模型的输出图，让学生说出各自回答了什么问题
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 建立“任务 = 输入 + 输出”的概念
  - name: 重点讲授
    minutes: 10
    content: 图片在计算机里的样子；辅助驾驶分级
    teacher: 用“像素放大镜”演示；讲 0～5 级，强调本书只做 0 级的“看懂和提醒”
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一，树立安全意识
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 1-1～1-3，重点讲上传文件、路径错误和 imread 返回 None
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 157
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明一张彩色图片在计算机里是怎样存储的，并计算一张 1920×1080 的彩色图片有多少个数字。
- 简答题：货车上的“前车碰撞提醒”用到了哪几种视觉任务？各自起什么作用？
- 简答题：有了能“看图说话”的多模态大模型，为什么还要学检测、分割这些专用模型？请说出两条理由。
- 实操题：修改实验 1-2 的代码：读入 `lane_yellow.jpg`，打印它的形状；找到黄色车道线上的一个像素，打印它的蓝、绿、红三个数；再把画面最下面 50 行涂成黑色，存成新图片。
- 实验报告：实验 1-1、实验 1-2、实验 1-3、实验 1-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
