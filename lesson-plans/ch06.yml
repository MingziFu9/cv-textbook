# 第 6 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 6
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出语义分割、实例分割、全景分割的输出各是什么，以及分割和检测的区别
  - 解释掩膜怎样用来抠图换背景，计算两个掩膜的交并比
  skill:
  - 运行并修改给定代码，用分割模型抠出人物、分出可行驶路面并算出路面占比
  - 使用 SAM 通过点或框分割任意物体，比较 SAM 和 YOLO 分割模型的用途
  - 读懂深度图，结合检测框判断画面里哪辆车离自己最近
  quality:
  - 认识单目深度估计只是“估计”，不能代替测量，坚持“辅助不是替代”
  - 用 SAM 等工具辅助标注时，对结果保持核查意识
key_points:
- 语义、实例、全景三种分割
- 掩膜与换背景公式、羽化
- YOLO -seg / -sem 模型与可行驶路面
- SAM 的提示与“先检测再分割”
- 深度图与远近线索
difficulties:
- point: 三种分割的区别
  solution: 用“三种分割对比”动画看左侧停着的车在语义和实例分割中的不同；用涂地图和剪剪影比喻
- point: 掩膜与彩色图相乘时的维度问题
  solution: 画出 (高, 宽) 和 (高, 宽, 3) 的形状，演示 mask[:, :, None]；手算羽化边缘一个像素
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 6 章 图像分割：精确到每个像素，操作交互动画“三种分割对比”、“点一下分割”；完成本章 ★ 实验 6-1～6-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：小林把第 5 章训练好的检测器装进了“智能辅助驾驶助手”，画面里的车和人都框出来了。可他很快发现一个问题。


      “老王，你……'
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 15
    content: 三种分割与掩膜换背景
    teacher: 用三种分割动画和实验 6-1 结果讲解，手算换背景公式
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一、二
  - name: 重点讲授
    minutes: 15
    content: SAM：点一下分割与“先检测再分割”
    teacher: 用“点一下分割”动画；对比点选 0.59 和框选 0.94
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 理解提示的歧义
  - name: 重点讲授
    minutes: 15
    content: 深度估计与场景重建
    teacher: 展示深度图，用近大远小、越靠下越近等线索讨论；强调估计不是测量
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 树立安全意识，为第 9 章铺垫
  - name: 实验答疑
    minutes: 25
    content: 答疑实验 6-1～6-3，重点讲 retina_masks、.cpu().numpy()、广播报错；提醒提前下载 mobile_sam.pt
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明语义分割、实例分割、全景分割的区别，并各举一个辅助驾驶中的用途。
- 简答题：实验 6-2 中，“行人过马路”照片的正前方路面占 83%。为什么程序仍然提醒“注意减速”？如果把两个判断条件的顺序调换，会出现什么问题？
- 简答题：比较 YOLO 实例分割模型和 SAM 的优缺点，说明各自适合什么任务。
- 实操题：修改实验 6-4 的代码：只对类别是 `person` 的目标估计距离，如果最近的行人在 15 米以内，打印“前方有行人，注意避让”，否则打印“附近没有行人”。用 `drive_city.jpg` 和 `street_crossing.jpg` 各运行一次，记录结果。
- 实验报告：实验 6-1、实验 6-2、实验 6-3、实验 6-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
