# 第 4 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 4
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出图像分类的输入和输出，解释 Top-1、Top-5 准确率的含义
  - 解释卷积神经网络中卷积层、池化层、分类层各做什么，为什么越往后看到的东西越抽象
  skill:
  - 运行并修改给定代码，用预训练模型认图，按“一类一个文件夹”整理数据集，训练一个五类道路目标分类器
  - 读懂训练输出和训练曲线，判断模型是欠拟合还是过拟合
  - 根据混淆矩阵找出最容易混淆的类别，分析认错的原因并提出改进办法
  quality:
  - 正视模型的错误，养成分析错例、找原因的工程习惯
  - 了解数据集许可（如 KITTI 仅限非商业），尊重数据版权
key_points:
- 分类的输入输出与 Top-1、Top-5
- 卷积层、池化层、分类层的作用
- 迁移学习与分类数据集的组织
- 训练曲线、过拟合与混淆矩阵
difficulties:
- point: 迁移学习为什么有用
  solution: 用“会骑自行车的人学电动车”比喻，对比从零训练 44.2% 和预训练 81.4%
- point: 读懂混淆矩阵、找出易混类别
  solution: 用动画“混淆矩阵读图”点格子看图片，分析厢式车被认成卡车、轿车的原因
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 158
    content: 阅读网页教材第 4 章 图像分类：让模型认出图片，操作交互动画“CNN 逐层看到了什么”、“混淆矩阵读图”；完成本章 ★ 实验 4-1～4-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林的车队要给每辆货车的行车记录做“路况统计”：一天下来，前方出现过多少辆轿车、厢式车、卡车，遇到过多少行人和骑车人。车……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: CNN 三种零件与迁移学习
    teacher: 用“CNN 逐层看到了什么”动画讲特征越往后越抽象；展示迁移学习对比图
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 10
    content: 训练曲线与混淆矩阵
    teacher: 讲欠拟合、过拟合；用混淆矩阵动画带学生找错例原因
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，形成分析错例的习惯
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 4-2、4-3，重点讲数据集路径、best.pt 位置、训练输出怎么读
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 157
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“会骑自行车的人学电动车”的比喻，解释什么是迁移学习，以及为什么数据少时要用迁移学习。
- 简答题：根据下面的混淆矩阵（行是真实，列是预测），计算总准确率和“猫”这一类认对的比例，并指出最容易混淆的两类。
- 简答题：实验 4-3 的模型最容易把厢式车和轿车、卡车混淆。请提出至少三条改进办法，并说明理由。
- 实操题：修改实验 4-3：用 `yolo26n-cls.pt` 训练 5 轮、图片尺寸 96，结果存到 `runs/road5_e5`，并打印验证集 Top-1 准确率。
- 实验报告：实验 4-1、实验 4-2、实验 4-3、实验 4-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
