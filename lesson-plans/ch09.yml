# 第 9 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 9
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出常见视觉应用（安防、辅助驾驶、医疗、质检、零售、增强现实）各用了哪些步骤和模型
  - 解释增强现实“找标记、算单应性矩阵、变形贴图”的原理，说出场景重建的几种做法
  skill:
  - 运行并修改给定代码，用 Gradio 把智能辅助驾驶助手做成网页，用 ArUco 标记码做增强现实
  - 测量和比较模型在不同输入尺寸下的速度，说出几种加速和部署的办法
  - 判断一个视觉应用是否符合个人信息保护等法规的要求，完成一个综合项目和合规自查
  quality:
  - 做视觉应用前按“拍了谁、存了什么、给了谁、对谁不公平、错了怎么办”自查
  - 在项目中贯彻“机器提醒、人来决定”，不夸大辅助驾驶能力
key_points:
- 视觉应用的行业配方与需求分析
- 增强现实：标记码与单应性矩阵
- Gradio 网页小工具
- 测速与模型部署
- 个人信息保护、人脸识别与汽车数据法规
- 视觉项目七步流程
difficulties:
- point: 单应性矩阵：四对点决定透视变换
  solution: 用“增强现实贴图”动画拖动四个角，对比“不做透视”；手算只缩放平移时的 H
- point: 把法规要求落实到自己的项目中
  solution: 用自查清单逐条检查实验 9-1 的网页：拍了谁、存了什么、公开链接的风险
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 9 章 视觉应用实战与综合项目，操作交互动画“增强现实贴图”；完成本章 ★ 实验 9-1～9-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：学期快结束了，小林把前八章做的程序一个个摆在桌面上：找车道线的、认车型的、检测车辆行人的、分路面的、估远近的、跟踪提醒的……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 15
    content: 行业配方与增强现实
    teacher: 拆解六个行业的应用；用增强现实贴图动画讲单应性矩阵
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 15
    content: 网页小工具与模型提速
    teacher: 演示实验 9-1 网页和实验 9-4 测速表（640/480/320）
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 联系部署实际
  - name: 重点讲授
    minutes: 15
    content: 伦理法规与项目流程
    teacher: 梳理三部法规，用自查清单检查网页；介绍综合项目选题和报告模板
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，布置综合项目
  - name: 实验答疑
    minutes: 25
    content: 答疑实验 9-1、9-2，重点讲端口占用、RGB/BGR、找不到标记码；综合项目分组与选题
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告；课外完成综合项目（实验 9-3），提交项目报告和合规自查表
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明增强现实把一张导航箭头“贴”到路面上的三个步骤，并说明为什么不能只把箭头缩放后贴上去。
- 简答题：某商场想在入口安装摄像头，用人脸识别统计“老顾客回头率”。请从法规角度分析这个方案存在的问题，并提出一个更合适的做法。
- 简答题：一个视觉项目的完整流程包括哪几步？以“健身计数”项目为例，每一步各写一句话说明要做什么。
- 实操题：修改实验 9-1 的 `report` 函数，使其只对“正前方区域”内的目标发出距离提醒（正前方区域的定义与 `front` 相同：画面下方 40%、左右居中 30% 宽度）。写出修改后的关键代码，并说明 `drive_highway.jpg` 的提醒会有什么变化。
- 实验报告：实验 9-1、实验 9-2、实验 9-3、实验 9-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
