# 第 8 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 8
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出生成式视觉的几种常见任务：文生图、图生图、局部重绘、图像修复、超分辨率
  - 解释扩散模型“训练时学猜噪声、生成时一步步去噪”的思路
  skill:
  - 运行并修改给定代码，用插值和超分辨率放大图片、用 OpenCV 修补老照片，并比较效果
  - 调整提示词、步数、引导强度、随机种子，生成指定场景的道路图片
  - 判断生成内容在什么场合必须标识，说出相关法规的要求
  quality:
  - 生成内容必须按规定标识，不用他人照片生成或换脸，遵守法律法规
  - 认识超分辨率“清楚不等于真实”，不把 AI 补出的细节当作证据
key_points:
- 生成式视觉的五类任务
- 扩散模型的加噪与去噪
- Stable Diffusion 五个参数与提示词
- 传统图像修复与遮罩
- 超分辨率与评价
- 生成内容标识的法规要求
difficulties:
- point: 扩散模型“训练学猜噪声、生成一步步去噪”
  solution: 用“加噪与去噪”动画拖动步数；手算第 100 步原图还占约 90%
- point: 超分辨率清晰度高、误差却最大
  solution: 用“放大对比滑块”对照原图找出猜错的细节；对比平均误差 11.8 和清晰度 666.5
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 8 章 生成式视觉：Stable Diffusion 与图像修复，操作交互动画“加噪与去噪”、“放大对比滑块”；完成本章 ★ 实验 8-1～8-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：小林训练的检测器在晴天表现不错，可一到雨天、夜里就频频漏检。


      “问题出在训练数据上，”老王说，“KITTI 是德国夏天……'
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 15
    content: 扩散模型与 Stable Diffusion 参数
    teacher: 用加噪去噪动画讲原理；演示（或播放预先生成的）不同步数、引导强度、种子的结果
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一；实验 8-3 待实测，教师课前在 GPU 上运行
  - name: 重点讲授
    minutes: 15
    content: 图像修复与超分辨率
    teacher: 展示老照片修补和顶帽找划痕；用放大对比滑块讨论“清楚不等于真实”
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二
  - name: 重点讲授
    minutes: 15
    content: 生成内容标识与版权
    teacher: 梳理三部规定，讨论 AI 换脸、模仿画家风格等案例
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 落实素养目标
  - name: 实验答疑
    minutes: 25
    content: 答疑实验 8-1、8-2；在 GPU 服务器上演示实验 8-3、8-4（待实测），无 GPU 时用国产在线平台完成提示词练习
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话描述扩散模型“训练”和“生成”各做什么，并说明随机种子在生成中的作用。
- 简答题：为了给辅助驾驶检测器补充雨天数据，你打算用生成的图片。请写出你的做法（用什么方法生成、怎样保证标注可用、怎样检验效果），并说明注意事项。
- 简答题：比较传统图像修复（`cv2.inpaint`）和扩散模型局部重绘的适用场景。
- 实操题：修改实验 8-1，把 `street_crossing.jpg` 中 `[170:330, 400:800]` 这一块缩小 4 倍再用三种方法放大，记录平均误差和清晰度，并判断结论是否和书中一致。
- 实验报告：实验 8-1、实验 8-2、实验 8-3、实验 8-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
