# 第 7 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 7
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出帧、帧率、分辨率的含义，计算一段视频有多少帧
  - 解释目标跟踪怎样给目标发号码牌、遮挡和漏检为什么会让号码牌换号
  - 解释为什么动作识别要看一段时间，用关节角度和“连续几帧”规则实现健身计数
  skill:
  - 运行并修改给定代码，用 OpenCV 读视频、抽帧、写视频
  - 使用跟踪结果做区域闯入提醒，并用框的面积变化判断目标在变近还是变远
  quality:
  - 驾驶员监测涉及敏感个人信息，录制视频只录自己，遵守个人信息保护要求
  - 理解提醒应以持续时间为依据，避免误报扰民，体会以人为本的设计
key_points:
- 帧、帧率与读写视频
- 目标跟踪的预测、配对、记住与 ID 切换
- 越线计数、区域闯入、变近变远
- 人体关键点、关节角度与动作计数规则
difficulties:
- point: 跟踪器为什么会换号，怎样减少换号
  solution: 用“跟踪号码牌”动画比较“只看重叠”（122 个号码）和“预测 + 记住”（5 个号码）
- point: 动作识别要看一段时间：两个门槛和连续几帧
  solution: 用“动作是一段时间”动画加抖动，对比连续 1 帧数出 15 个、连续 3 帧回到 5 个
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 7 章 视频分析：让模型看懂动态画面，操作交互动画“跟踪号码牌”、“动作是一段时间”；完成本章 ★ 实验 7-1～7-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林的“智能辅助驾驶助手”已经能在一张照片里框出车和人、分出路面、看出远近。他兴冲冲地把行车记录仪拍的一段视频交给程序，……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系生活和贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 15
    content: 视频读写与实时速度
    teacher: 演示 VideoCapture 循环和 VideoWriter，算 25 fps 每帧 40 毫秒
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 建立实时意识
  - name: 重点讲授
    minutes: 15
    content: 目标跟踪与跟踪的用法
    teacher: 用跟踪号码牌动画讲三件事；讲脚下点和面积倍数（0.75 变远、3.76 的陷阱）
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 15
    content: 姿态估计、动作识别与驾驶员监测
    teacher: 用动作时间轴动画讲两个门槛；讨论驾驶员监测的个人信息问题
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，落实素养目标
  - name: 实验答疑
    minutes: 25
    content: 答疑实验 7-1～7-3，重点讲 r.boxes.id 为 None、换视频重新加载模型；布置实验 7-4 自录视频
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章 3 道课堂练习
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告；选做实验 7-4 用自己录的视频完成
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明跟踪器的“预测、配对、记住”三件事，并说明为什么遮挡会导致 ID 切换。
- 简答题：实验 7-3 中，如果把“连续几帧”从 3 改成 30，会出现什么问题？结合本视频每个俯卧撑约 2 秒说明。
- 简答题：比较专门的视觉程序和多模态大模型在视频分析中各自的优缺点，并说明辅助驾驶的实时提醒应该用哪一种。
- 实操题：修改实验 7-2 第 4 步，统计“同一时刻区域里最多有几个人”，并打印出现最多人数的帧号。
- 实验报告：实验 7-1、实验 7-2、实验 7-3、实验 7-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
