# ============================================================
# 课程配置：全书唯一需要手改的配置文件
# 改完后运行  python tools/course.py sync  ，会自动更新：
#   mkdocs.yml 的站点名和导航、首页课程信息与目录、缺少的章节骨架、
#   实验目录、术语表的章节小节、学习图谱的章节列表、附录编号
# 课件（tools/make_slides.py）、教案（tools/make_lesson_plan.py）、Word/PDF 版（tools/export_docx.py）
# 也从这里读取课程名、学时等信息
# ============================================================

title: 计算机视觉及应用实战
description: 面向成人教育人工智能技术应用专业（专科）的《计算机视觉及应用实战》教材，零基础起步，每章配套 4 个动手实验，贯穿“智能辅助驾驶助手”项目
audience: 成人教育（继续教育）人工智能技术应用专业专科学生，多为在职学习者
github_user: MingziFu9                # 网址 https://<github_user>.github.io/<repo>/
repo: cv-textbook

credits: 4                            # 学分
hours: {theory: 36, lab: 36}          # 学时：理论 + 实验
semester: 4                           # 开课学期
exam: 开卷                            # 期末考核方式
labs_per_chapter: 4                   # 每章实验数；0 表示没有实验
lab_section: 本章实验                 # 实验部分的二级标题；导论用“在线体验”
lab_word: 实验                        # 每个实验的三级标题前缀（### 实验 N-M）；导论用“体验”
frontier_title: 前沿视窗              # 每章“前沿”小节的名称，导论用“身边的 AI”
certificates: []

# 章节：dir 是 docs/chapters/ 下的文件夹名（两位章号开头），short 用于学习图谱等窄处
# theory / lab 是本章学时；labs 可单独覆盖本章实验数；offline 可指定本章线下学时（不写则按 online_ratio 分）
chapters:
  - {dir: 01-intro, title: 走进计算机视觉, short: 走进视觉, theory: 4, lab: 4, offline: 1}
  - {dir: 02-image-processing, title: 图像处理基础：用 OpenCV 修图, short: 图像处理, theory: 4, lab: 4, offline: 1}
  - {dir: 03-features, title: 图像特征：从边缘到卷积, short: 图像特征, theory: 4, lab: 4, offline: 1}
  - {dir: 04-classification, title: 图像分类：让模型认出图片, short: 图像分类, theory: 4, lab: 4, offline: 1}
  - {dir: 05-detection, title: 目标检测：找出图中的物体, short: 目标检测, theory: 4, lab: 4, offline: 2}
  - {dir: 06-segmentation, title: 图像分割：精确到每个像素, short: 图像分割, theory: 4, lab: 4, offline: 2}
  - {dir: 07-video, title: 视频分析：让模型看懂动态画面, short: 视频分析, theory: 4, lab: 4, offline: 2}
  - {dir: 08-generative, title: 生成式视觉：Stable Diffusion 与图像修复, short: 生成式视觉, theory: 4, lab: 4, offline: 2}
  - {dir: 09-applications, title: 视觉应用实战与综合项目, short: 应用实战, theory: 4, lab: 4, offline: 2}

# 其他页面：追加在导航“常见问题”之后，如 extra_pages: [{file: mock-exam.md, title: 在线模拟卷}]
extra_pages: [{file: mock-exam.md, title: 在线模拟卷}]

# 附录：docs/appendix/ 下的文件，按顺序自动编号为 A、B、C……（术语表固定为 glossary.md）
appendices:
  - {file: a-python.md, title: 零基础 Python 入门}
  - {file: b-libraries.md, title: OpenCV 与 YOLO 速查}
  - {file: c-environment.md, title: 实验环境与数据说明}
  - {file: glossary.md, title: 术语表}
  - {file: e-project.md, title: 实验报告模板与综合项目指南}

# 教案默认设置（每章可在 lesson-plans/chNN.yml 里覆盖）
lesson_plan:
  online_ratio: 0.5                   # 线上学时占比（开放大学以线上为主，按实际改）
  teacher: ""                         # 授课教师，留空则教案上留出填写位置
  school: ""                          # 学校名称，留空则不显示

# 首页“先玩一玩”轮播：按轮播顺序写，第 1 个放画面最震撼的。sim 是 docs/sims/ 下的目录名，hook 是一句问句，play 是一句玩法；
# steps 是录短视频时自动做的操作（写法见 编写规范.md“首页轮播”）。改完运行 python tools/showcase.py record 重录视频。
showcase_tagline: "让机器看懂照片和视频，从像素到大模型"
showcase:
  - sim: sam-click
    hook: "在照片上点一下，整辆车就被抠出来"
    play: "天空、路面、车辆，点哪块亮哪块。"
    steps:
      - ["click", "累加多块", {"hold": 0.3}]
      - ["at", "#cv", 0.7, 0.61, {"hold": 0.9}]
      - ["at", "#cv", 0.95, 0.7, {"hold": 0.9}]
      - ["at", "#cv", 0.36, 0.82, {"hold": 0.9}]
      - ["at", "#cv", 0.3, 0.22, {"hold": 1.4}]
      - ["poster"]
      - ["click", "清空", {"hold": 0.6}]
  - sim: seg-types
    hook: "同一条街，三种分割各看出了什么"
    play: "语义、实例、全景分割一键切换。"
    steps:
      - ["click", "语义分割", {"hold": 1}]
      - ["click", "实例分割", {"hold": 1}]
      - ["click", "全景分割", {"hold": 1.2}]
      - ["poster"]
      - ["click", "行人过马路", {"hold": 1}]
      - ["slide", "#op", 95, {"hold": 1}]
  - sim: sr-compare
    hook: "模糊小图放大 4 倍，AI 补出了细节"
    play: "左右拖动分界线，对比插值和超分辨率。"
    steps:
      - ["draw", "#stage", [[0.5, 0.55], [0.12, 0.55], [0.88, 0.55], [0.5, 0.55]], {"seg": 0.9, "hold": 0.6}]
      - ["click", "超分辨率", {"hold": 0.4}]
      - ["click", "最近邻", {"nth": 1, "hold": 0.4}]
      - ["draw", "#stage", [[0.5, 0.55], [0.2, 0.55], [0.8, 0.55]], {"seg": 0.9, "hold": 0.6}]
      - ["poster"]
      - ["click", "行人过马路", {"hold": 0.4}]
      - ["draw", "#stage", [[0.8, 0.55], [0.3, 0.55]], {"seg": 0.9, "hold": 1}]
  - sim: cnn-layers
    hook: "一张车的照片，在网络里一层层变成了什么"
    play: "从边缘到形状，再到“厢式车”。"
    steps:
      - ["click", {"role": "button", "name": "第 0 层", "exact": false}, {"hold": 0.8}]
      - ["click", {"role": "button", "name": "第 2 层", "exact": false}, {"hold": 0.8}]
      - ["click", {"role": "button", "name": "第 4 层", "exact": false}, {"hold": 0.8}]
      - ["poster"]
      - ["click", {"role": "button", "name": "第 8 层", "exact": false}, {"hold": 0.8}]
      - ["click", "行人", {"hold": 1}]
      - ["click", {"role": "button", "name": "输出 1000 类", "exact": false}, {"hold": 1}]
  - sim: action-timeline
    hook: "AI 怎样数清你做了几个俯卧撑？"
    play: "关节角度曲线和视频画面同步播放。"
    steps:
      - ["click", "▶ 播放", {"hold": 5}]
      - ["poster"]
