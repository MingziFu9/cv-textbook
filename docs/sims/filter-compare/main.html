<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滤波器对比</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.pics { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:600px) { .pics { grid-template-columns:1fr; } }
.pics canvas { width:100%; border:1px solid var(--line); border-radius:6px; cursor:crosshair; image-rendering:auto; }
.cap { font-size:12px; color:var(--muted); text-align:center; }
table.t td { min-width:2.6em; font-variant-numeric:tabular-nums; }
td.cur { outline:2px solid var(--accent); font-weight:bold; }
</style>
</head>
<body>
<h1>滤波器对比：用邻居的值替换自己</h1>
<div class="sub">选一种噪声和一种滤波方法，拖动“窗口大小”看去噪效果和清晰度怎样此消彼长。在右图上点一下，下方显示这个点周围 3×3 的灰度值和三种算法各自算出的结果。</div>
<div class="row ex"><span class="lbl">图片与噪声：</span>
  <button data-n="salt" class="on">街道 + 椒盐噪声</button><button data-n="gauss">街道 + 高斯噪声</button><button data-n="night">夜间画面调亮后（自带噪点）</button>
</div>
<div class="row ex"><span class="lbl">滤波方法：</span>
  <button data-f="none">不处理</button><button data-f="mean">均值</button><button data-f="gauss">高斯</button><button data-f="median" class="on">中值</button>
</div>
<div class="row"><span>窗口大小</span><input type="range" id="k" min="0" max="4" value="1"><span class="big mono" id="kv"></span></div>
<div class="pics">
  <div><canvas id="a"></canvas><div class="cap">有噪声的图</div></div>
  <div><canvas id="b"></canvas><div class="cap" id="bcap">滤波后</div></div>
</div>
<div class="msg" id="msg"></div>
<div id="nb"></div>
<div class="note">街道照片裁自 KITTI 数据集（CC BY-NC-SA 3.0），夜间画面是实验 2-2 均衡化后的结果。浏览器中的计算方法与 OpenCV 的 cv2.blur、cv2.GaussianBlur、cv2.medianBlur 相同（边缘像素的处理略有差别）。</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, KS = [1, 3, 5, 7, 9];
  var A = $("a"), B = $("b"), actx = A.getContext("2d", { willReadFrequently: true }), bctx = B.getContext("2d");
  var img = new Image(), W, Ht, noisy, out, mode = "salt", filt = "median", sel = null, cache = {};
  function rnd(seed) { return function () { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }; }
  function load(name, then) { var im = new Image(); im.onload = function () { then(im); }; im.src = "img/" + name; }
  function setup() {
    load(mode === "night" ? "night.jpg" : "street.jpg", function (im) {
      W = A.width = B.width = im.width; Ht = A.height = B.height = im.height;
      actx.drawImage(im, 0, 0); var d = actx.getImageData(0, 0, W, Ht), r = rnd(7);
      for (var i = 0; i < W * Ht; i++) {
        if (mode === "salt") { var u = r(); if (u < 0.04) { d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = 0; } else if (u > 0.96) { d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = 255; } }
        if (mode === "gauss") for (var c = 0; c < 3; c++) { var g = Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.2832 * r()); d.data[i * 4 + c] = Math.max(0, Math.min(255, d.data[i * 4 + c] + 20 * g)); }
      }
      actx.putImageData(d, 0, 0); noisy = d.data; run();
    });
  }
  function kernel(k) { var s = 0.3 * ((k - 1) * 0.5 - 1) + 0.8, w = []; for (var i = 0; i < k; i++) { var x = i - (k - 1) / 2; w.push(Math.exp(-x * x / (2 * s * s))); } var t = w.reduce(function (p, q) { return p + q; }, 0); return w.map(function (v) { return v / t; }); }
  function at(x, y, c) { x = Math.max(0, Math.min(W - 1, x)); y = Math.max(0, Math.min(Ht - 1, y)); return noisy[(y * W + x) * 4 + c]; }
  function apply(f, k) {
    var o = new Uint8ClampedArray(W * Ht * 4), r = (k - 1) / 2, gw = kernel(k), buf = [];
    for (var y = 0; y < Ht; y++) for (var x = 0; x < W; x++) for (var c = 0; c < 3; c++) {
      var v;
      if (f === "none" || k === 1) v = at(x, y, c);
      else if (f === "mean") { v = 0; for (var j = -r; j <= r; j++) for (var i = -r; i <= r; i++) v += at(x + i, y + j, c); v /= k * k; }
      else if (f === "gauss") { v = 0; for (j = -r; j <= r; j++) for (i = -r; i <= r; i++) v += at(x + i, y + j, c) * gw[i + r] * gw[j + r]; }
      else { buf.length = 0; for (j = -r; j <= r; j++) for (i = -r; i <= r; i++) buf.push(at(x + i, y + j, c)); buf.sort(function (p, q) { return p - q; }); v = buf[buf.length >> 1]; }
      o[(y * W + x) * 4 + c] = v; o[(y * W + x) * 4 + 3] = 255;
    }
    return o;
  }
  function run() {
    var k = KS[+$("k").value]; $("kv").textContent = k + "×" + k;
    out = apply(filt, k); bctx.putImageData(new ImageData(out, W, Ht), 0, 0);
    var names = { none: "不处理", mean: "均值滤波", gauss: "高斯滤波", median: "中值滤波" };
    $("bcap").textContent = names[filt] + "（窗口 " + k + "×" + k + "）";
    $("msg").innerHTML = "OpenCV 写法：<code>" + ({ none: "（原图）", mean: "cv2.blur(img, (" + k + ", " + k + "))", gauss: "cv2.GaussianBlur(img, (" + k + ", " + k + "), 0)", median: "cv2.medianBlur(img, " + k + ")" })[filt] + "</code>";
    if (sel) neighbors();
  }
  function gray(x, y) { return Math.round(0.299 * at(x, y, 0) + 0.587 * at(x, y, 1) + 0.114 * at(x, y, 2)); }
  function neighbors() {
    var x = sel[0], y = sel[1], v = [], h = '<table class="t" style="display:inline-table;margin-right:12px"><tr><th colspan="3">第 ' + y + " 行第 " + x + " 列周围 3×3（灰度）</th></tr>";
    for (var j = -1; j <= 1; j++) { h += "<tr>"; for (var i = -1; i <= 1; i++) { var g = gray(x + i, y + j); v.push(g); h += '<td class="' + (i === 0 && j === 0 ? "cur" : "") + '">' + g + "</td>"; } h += "</tr>"; }
    h += "</table>";
    var s = v.slice().sort(function (p, q) { return p - q; }), mean = v.reduce(function (p, q) { return p + q; }, 0) / 9;
    var w = [1, 2, 1, 2, 4, 2, 1, 2, 1], ga = 0; for (var t = 0; t < 9; t++) ga += v[t] * w[t]; ga /= 16;
    h += '<div style="display:inline-block;vertical-align:top;font-size:13px">均值：9 个数加起来 ÷ 9 = <b>' + mean.toFixed(1) + "</b><br>高斯：中间权重大（1-2-1 / 2-4-2 / 1-2-1，÷16）= <b>" + ga.toFixed(1) + "</b><br>中值：从小到大排好 [" + s.join(", ") + "]，取正中间 = <b>" + s[4] + "</b><br>原来的值：<b>" + v[4] + "</b></div>";
    $("nb").innerHTML = h;
  }
  [A, B].forEach(function (cv) { cv.addEventListener("click", function (e) {
    var b = cv.getBoundingClientRect(); sel = [Math.floor((e.clientX - b.left) / b.width * W), Math.floor((e.clientY - b.top) / b.height * Ht)]; neighbors(); }); });
  $("k").oninput = run;
  document.querySelectorAll("[data-n]").forEach(function (b) { b.onclick = function () {
    document.querySelectorAll("[data-n]").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); mode = b.dataset.n; setup(); }; });
  document.querySelectorAll("[data-f]").forEach(function (b) { b.onclick = function () {
    document.querySelectorAll("[data-f]").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); filt = b.dataset.f; run(); }; });
  setup();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
