<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNN 逐层看到了什么</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.wrap { display:grid; grid-template-columns:200px 1fr; gap:14px; align-items:start; }
@media (max-width:640px) { .wrap { grid-template-columns:1fr; } }
.wrap img { width:100%; max-width:420px; border:1px solid var(--line); border-radius:6px; image-rendering:pixelated; }
.pipe { display:flex; gap:4px; flex-wrap:wrap; margin:8px 0; }
.pipe button { border-radius:6px; font-size:12px; line-height:1.3; padding:4px 8px; }
.pipe .arrow { color:var(--muted); align-self:center; }
.desc { font-size:13.5px; background:var(--soft); border-radius:6px; padding:8px 10px; margin-top:8px; }
</style>
</head>
<body>
<h1>CNN 逐层看到了什么</h1>
<div class="sub">同一张图交给分类模型，每一层都会输出很多张“特征图”。选一层，看它最活跃的 16 张特征图：越亮的地方，说明这一层的某个卷积核在那里“找到了”自己要找的东西。</div>
<div class="row ex"><span class="lbl">换图：</span><button data-k="van" class="on">白色厢式车</button><button data-k="ped">行人</button><button data-k="lane">车道</button></div>
<div class="pipe" id="pipe"></div>
<div class="wrap">
  <div><img id="inp" alt="输入图片"><div class="msg" id="pred"></div></div>
  <div><img id="map" alt="特征图"><div class="desc" id="desc"></div></div>
</div>
<div class="note">数据：编者用本书的 yolo26n-cls 预训练模型实际运行，取第 0、2、4、6、8 层的输出，每层按平均激活强度挑出最活跃的 16 个通道，各自缩放到 0～255 显示（脚本 tools/figures/ch04_featuremaps.py）。图片裁自 KITTI（CC BY-NC-SA 3.0）和 Udacity（MIT）。</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, key = "van", layer = "0", meta = null;
  var L = ["0", "2", "4", "6", "8"];
  var D = {
    "0": "第 0 层（最靠近输入）：特征图还很大，能认出原图的样子。很多卷积核在找<b>边缘</b>和<b>颜色</b>：有的只在竖直的边上亮，有的只在白色车身上亮，和第 3 章的 Sobel 很像。",
    "2": "第 2 层：开始组合边缘，出现<b>纹理</b>和<b>角点</b>（车窗格子、车轮弧线），原图的样子已经模糊了。",
    "4": "第 4 层：特征图缩小到 28×28，每个点“看到”原图上更大的一块，开始对<b>部件</b>有反应（车窗、车灯、人的上身）。",
    "6": "第 6 层：14×14，人已经看不出是什么了，但每个点代表的是原图一大块区域里有没有某种“部件组合”。",
    "8": "第 8 层（接近输出）：只剩 7×7，却有 256 个通道。这些高度抽象的特征最后汇总起来，决定“这是厢式车”还是“这是别的”。"
  };
  function draw() {
    var m = meta[key], s = m.layers[layer];
    $("inp").src = "img/" + key + "_input.jpg";
    $("map").src = "img/" + key + "_L" + layer + ".jpg";
    $("pred").innerHTML = "模型的判断（1000 类）：<br>" + m.top.map(function (t) { return t[0] + " " + (t[1] * 100).toFixed(1) + "%"; }).join("<br>");
    $("desc").innerHTML = "<b>输出形状：" + s[0] + " 个通道 × " + s[1] + "×" + s[2] + "</b>（这里显示其中 16 个）<br>" + D[layer];
    var h = '<button disabled>输入 224×224×3</button>';
    L.forEach(function (l) { var t = m.layers[l]; h += '<span class="arrow">→</span><button data-l="' + l + '" class="' + (l === layer ? "on" : "") + '">第 ' + l + " 层<br>" + t[1] + "×" + t[2] + "×" + t[0] + "</button>"; });
    h += '<span class="arrow">→</span><button disabled>输出 1000 类</button>';
    $("pipe").innerHTML = h;
    document.querySelectorAll("[data-l]").forEach(function (b) { b.onclick = function () { layer = b.dataset.l; draw(); }; });
  }
  document.querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () {
    document.querySelectorAll("[data-k]").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); key = b.dataset.k; draw(); }; });
  fetch("img/meta.json").then(function (r) { return r.json(); }).then(function (j) { meta = j; draw(); });
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
